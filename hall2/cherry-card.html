<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그린트리의 벚꽃 독서 3D 명언 카드</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: radial-gradient(circle at 50% 30%, #2b3a4a 0%, #151d26 60%, #0d1217 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: #fff;
    user-select: none;
    position: relative;
  }

  /* Canvas for Falling Petals */
  #petalCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 35; /* 꽃잎이 카드 그림 맨 앞으로 흩날리도록 상위 레이어로 배치 */
  }

  /* Audio Button */
  .sound-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 50;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.25s ease;
  }
  .sound-btn:active {
    transform: scale(0.92);
  }
  .sound-btn.playing {
    background: rgba(255, 182, 193, 0.35);
    border-color: #ffb6c1;
    box-shadow: 0 0 15px rgba(255, 182, 193, 0.5);
  }

  /* Card Container */
  .scene {
    width: 90vw;
    max-width: 380px;
    height: 105vw;
    max-height: 480px;
    perspective: 1200px;
    z-index: 20;
    cursor: pointer;
    margin-bottom: 25px;
  }

  .card-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.34, 1.3, 0.64, 1);
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 182, 193, 0.2);
  }

  .card-3d.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.2);
  }

  /* FRONT FACE */
  .card-front {
    background: #000;
  }
  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .front-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 20px;
    background: linear-gradient(to top, rgba(10, 18, 28, 0.85) 0%, rgba(10, 18, 28, 0.3) 65%, transparent 100%);
    text-align: center;
  }
  .front-overlay h3 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    margin-bottom: 4px;
  }
  .front-overlay p {
    font-size: 13px;
    color: #ffccd5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    letter-spacing: 0.5px;
  }

  /* BACK FACE */
  .card-back {
    background: linear-gradient(135deg, #fdfbf7 0%, #f4ede1 100%);
    transform: rotateY(180deg);
    padding: 35px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #2c251e;
    box-shadow: inset 0 0 40px rgba(180, 140, 100, 0.15);
    border: 2px solid rgba(212, 175, 55, 0.4);
  }

  .back-inner-border {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
    border: 1px solid rgba(190, 150, 90, 0.3);
    border-radius: 12px;
    pointer-events: none;
  }

  .back-header {
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .back-header .badge {
    display: inline-block;
    padding: 4px 14px;
    background: rgba(190, 150, 90, 0.15);
    border: 1px solid rgba(190, 150, 90, 0.3);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: #8c6837;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .back-header h2 {
    font-size: 21px;
    color: #1e1914;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .quote-body {
    position: relative;
    z-index: 2;
    text-align: center;
    margin: auto 0;
    padding: 0 5px;
  }
  .quote-mark {
    font-size: 38px;
    line-height: 1;
    color: #c9a96e;
    opacity: 0.5;
    font-family: Georgia, serif;
    margin-bottom: -5px;
  }
  .quote-text {
    font-size: 15.5px;
    line-height: 1.85;
    color: #382e25;
    font-weight: 500;
    word-break: keep-all;
    letter-spacing: -0.3px;
  }
  .quote-sub {
    font-size: 13px;
    color: #7d6b58;
    line-height: 1.6;
    margin-top: 14px;
    font-style: italic;
    word-break: keep-all;
  }

  .back-footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding-top: 15px;
    border-top: 1px dashed rgba(190, 150, 90, 0.35);
  }
  .author {
    font-size: 14px;
    font-weight: 700;
    color: #614620;
    letter-spacing: 0.5px;
  }
  .signature {
    font-size: 11.5px;
    color: #9c8a77;
    margin-top: 4px;
  }

  /* Interaction Guidance */
  .hint {
    z-index: 20;
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(0, 0, 0, 0.35);
    padding: 8px 18px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: pulse 2.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }

  /* Autoplay / Audio Unlock Overlay */
  .audio-unlock-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 100;
    background: rgba(13, 18, 23, 0.45);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .audio-unlock-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .unlock-box {
    background: linear-gradient(135deg, rgba(255, 182, 193, 0.25) 0%, rgba(255, 218, 224, 0.15) 100%);
    border: 1.5px solid rgba(255, 182, 193, 0.6);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px rgba(255, 182, 193, 0.4);
    border-radius: 30px;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: unlockPulse 1.8s infinite;
  }
  @keyframes unlockPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 182, 193, 0.4); }
    50% { transform: scale(1.04); box-shadow: 0 0 30px rgba(255, 182, 193, 0.7); }
  }
  .unlock-box span {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
</style>
</head>

  <div class=unlock-box>
    <span style="font-size:22px;">🌸</span>
    <span>화면을 터치하면 피아노 음악이 시작됩니다</span>
  </div>
</div>

<script>
// --- Web Audio API: Continuous Acoustic Piano & Chime Bell Synthesizer ---
let audioCtx = null;
let isBgmPlaying = false;
let pianoLoopTimer = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Chime Bell Sound (Pure Pentatonic Wind Chime when flipping card)
function playChime() {
  initAudio();
  if (!audioCtx) return;

  const notes = [1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00, 2637.02];
  const now = audioCtx.currentTime;

  notes.forEach((freq, idx) => {
    const delay = idx * 0.05 + (Math.random() * 0.02);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + delay);

    gain.gain.setValueAtTime(0, now + delay);
    gain.gain.linearRampToValueAtTime(0.16, now + delay + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 1.8);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now + delay);
    osc.stop(now + delay + 1.85);
  });
}

// Gentle Acoustic Piano Note Synthesizer with warm harmonics
function playPianoNote(freq, time, dur, vol = 0.065) {
  if (!audioCtx) return;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(freq, time);

  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(freq * 2, time);

  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(vol, time + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(time);
  osc2.start(time);
  osc1.stop(time + dur + 0.05);
  osc2.stop(time + dur + 0.05);
}

// Beautiful Lyrical Piano Waltz Progression
const chords = [
  { bass: 130.81, arps: [196.00, 246.94, 329.63, 392.00] }, // Cmaj7
  { bass: 174.61, arps: [220.00, 261.63, 329.63, 440.00] }, // Fmaj7
  { bass: 164.81, arps: [196.00, 246.94, 293.66, 329.63] }, // Em7
  { bass: 110.00, arps: [164.81, 196.00, 246.94, 329.63] }, // Am9
  { bass: 146.83, arps: [174.61, 220.00, 261.63, 349.23] }, // Dm7
  { bass: 98.00,  arps: [196.00, 261.63, 293.66, 392.00] }, // G7sus4->G7
  { bass: 130.81, arps: [196.00, 293.66, 329.63, 523.25] }, // Cadd9
  { bass: 130.81, arps: [196.00, 246.94, 329.63, 392.00] }  // Cmaj7
];

let chordIdx = 0;
function schedulePianoBar() {
  if (!isBgmPlaying || !audioCtx) return;
  const now = audioCtx.currentTime;
  const c = chords[chordIdx % chords.length];
  chordIdx++;

  playPianoNote(c.bass, now, 3.6, 0.085);
  playPianoNote(c.arps[0], now + 0.65, 2.6, 0.045);
  playPianoNote(c.arps[1], now + 1.30, 2.6, 0.045);
  playPianoNote(c.arps[2], now + 1.95, 2.6, 0.055);
  playPianoNote(c.arps[3], now + 2.60, 2.6, 0.045);

  pianoLoopTimer = setTimeout(schedulePianoBar, 3200);
}

function startBgm() {
  initAudio();
  if (isBgmPlaying) return;
  isBgmPlaying = true;
  const btn = document.getElementById('soundBtn');
  if (btn) btn.classList.add('playing');
  schedulePianoBar();
}

function stopBgm() {
  isBgmPlaying = false;
  if (pianoLoopTimer) {
    clearTimeout(pianoLoopTimer);
    pianoLoopTimer = null;
  }
  const btn = document.getElementById('soundBtn');
  if (btn) btn.classList.remove('playing');
}

// User-toggleable sound button
document.getElementById('soundBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (isBgmPlaying) {
    stopBgm();
  } else {
    startBgm();
  }
});

// Autostart BGM logic & Audio Unlock Overlay
const audioUnlock = document.getElementById('audioUnlock');

function handleFirstUnlock(e) {
  initAudio();
  startBgm();
  if (audioUnlock) {
    audioUnlock.classList.add('hidden');
  }
  window.removeEventListener('touchstart', handleFirstUnlock);
  window.removeEventListener('click', handleFirstUnlock);
  window.removeEventListener('pointerdown', handleFirstUnlock);
}

// Global listeners for first interaction (unlocks audio without flipping card!)
window.addEventListener('touchstart', handleFirstUnlock, { passive: true });
window.addEventListener('click', handleFirstUnlock);
window.addEventListener('pointerdown', handleFirstUnlock);

if (audioUnlock) {
  audioUnlock.addEventListener('click', (e) => {
    e.stopPropagation();
    handleFirstUnlock(e);
  });
}

// Try auto-play immediately without interaction
window.addEventListener('DOMContentLoaded', () => {
  try {
    initAudio();
    if (audioCtx && audioCtx.state === 'running') {
      startBgm();
      if (audioUnlock) audioUnlock.classList.add('hidden');
    }
  } catch (err) {}
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isBgmPlaying && audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
});

// --- 3D Card Flip Interaction ---
const card = document.getElementById('card');
const hintText = document.getElementById('hintText');
let isFlipped = false;

function toggleCard(e) {
  // If BGM wasn't started yet, start it
  if (!isBgmPlaying) {
    startBgm();
  }
  if (audioUnlock) {
    audioUnlock.classList.add('hidden');
  }
  
  // Play sparkling chime on flip
  playChime();
  
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);

  if (hintText) {
    hintText.innerHTML = isFlipped
      ? '<span>✨ 카드를 터치하면 그림으로 돌아갑니다</span>'
      : '<span>✨ 카드를 터치하면 차임벨과 함께 뒤집어집니다</span>';
  }
}

document.getElementById('cardScene').addEventListener('click', toggleCard);

// --- Realistic Delicate Falling Cherry Blossom Petals Engine (Smaller & Dainty) ---
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const petals = [];
const TOTAL_PETALS = 55;

class Petal {
  constructor() {
    this.reset(true);
  }

  reset(init = false) {
    this.x = Math.random() * (width + 80) - 40;
    this.y = init ? Math.random() * height : -15 - Math.random() * 30;
    this.size = 5.5 + Math.random() * 5.0;
    this.speedY = 0.8 + Math.random() * 1.4;
    this.speedX = 0.5 + Math.random() * 1.0;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.03;
    this.flip = Math.random() * Math.PI;
    this.flipSpeed = 0.02 + Math.random() * 0.035;
    
    const colors = [
      'rgba(255, 192, 203, 0.88)',
      'rgba(255, 182, 193, 0.92)',
      'rgba(255, 218, 224, 0.85)',
      'rgba(255, 235, 238, 0.80)',
      'rgba(255, 170, 185, 0.90)'
    ];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }

  update() {
    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.y * 0.018) * 0.5;
    this.rotation += this.rotationSpeed;
    this.flip += this.flipSpeed;

    if (this.y > height + 20 || this.x > width + 40) {
      this.reset();
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.scale(1, Math.sin(this.flip));

    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-this.size * 0.5, -this.size * 0.6, -this.size * 0.8, -this.size * 1.2, 0, -this.size * 1.6);
    ctx.bezierCurveTo(this.size * 0.8, -this.size * 1.2, this.size * 0.5, -this.size * 0.6, 0, 0);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -this.size * 1.1);
    ctx.stroke();

    ctx.restore();
  }
}

for (let i = 0; i < TOTAL_PETALS; i++) {
  petals.push(new Petal());
}

function animatePetals() {
  ctx.clearRect(0, 0, width, height);
  petals.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animatePetals);
}
animatePetals();
</script>
